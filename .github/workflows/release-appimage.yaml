name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      APPDIR: AppDir
      WPE_ROOT: ${{ github.workspace }}/.deps/wpe/root
      WPE_LIBDIR: ${{ github.workspace }}/.deps/wpe/root/usr/lib/x86_64-linux-gnu
      WPE_PKGCONFIG: ${{ github.workspace }}/.deps/wpe/root/usr/lib/x86_64-linux-gnu/pkgconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            build-essential \
            clang \
            cmake \
            curl \
            dpkg-dev \
            desktop-file-utils \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libepoxy-dev \
            libfuse2t64 \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ninja-build \
            patchelf \
            pkg-config \
            xdg-dbus-proxy \
            xz-utils

      - name: Download WPE packages
        run: |
          set -eux

          DEB_DIR="${GITHUB_WORKSPACE}/.deps/wpe/debs"
          APT_ROOT="${GITHUB_WORKSPACE}/.deps/apt"
          mkdir -p \
            "${DEB_DIR}" \
            "${WPE_ROOT}" \
            "${APT_ROOT}/etc" \
            "${APT_ROOT}/state/lists/partial" \
            "${APT_ROOT}/cache/archives/partial"

          cat > "${APT_ROOT}/etc/sources.list" <<'EOF'
          deb [arch=amd64] https://deb.debian.org/debian sid main
          EOF

          APT_OPTS=(
            -o Dir::Etc::sourcelist="${APT_ROOT}/etc/sources.list"
            -o Dir::Etc::sourceparts=-
            -o Dir::State="${APT_ROOT}/state"
            -o Dir::Cache="${APT_ROOT}/cache"
            -o APT::Architecture=amd64
          )

          apt-get "${APT_OPTS[@]}" update

          base_packages=(
            libwpe-1.0-1
            libwpe-1.0-dev
            libwpebackend-fdo-1.0-1
            libwpebackend-fdo-1.0-dev
            libwpewebkit-2.0-1
            libwpewebkit-2.0-dev
          )

          {
            printf '%s\n' "${base_packages[@]}"
            apt-cache "${APT_OPTS[@]}" depends "${base_packages[@]}" \
              | sed -nE 's/^\s*(Pre)?Depends:\s*([^ ]+).*/\2/p'
          } | sed '/^</d' | sort -u > "${DEB_DIR}/packages.txt"

          while IFS= read -r package; do
            [ -n "${package}" ] || continue
            (cd "${DEB_DIR}" && apt-get "${APT_OPTS[@]}" download "${package}")
          done < "${DEB_DIR}/packages.txt"

          for deb in "${DEB_DIR}"/*.deb; do
            dpkg-deb -x "${deb}" "${WPE_ROOT}"
          done

          find "${WPE_PKGCONFIG}" -name '*.pc' -print0 | while IFS= read -r -d '' file; do
            sed -i "s#^prefix=/usr\$#prefix=${WPE_ROOT}/usr#" "${file}"
          done

      - name: Verify WPE toolchain
        env:
          PKG_CONFIG_PATH: ${{ env.WPE_PKGCONFIG }}:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          LD_LIBRARY_PATH: ${{ env.WPE_LIBDIR }}
        run: |
          pkg-config --atleast-version=2.50 wpe-webkit-2.0
          pkg-config --modversion wpe-webkit-2.0
          pkg-config --modversion wpebackend-fdo-1.0
          pkg-config --modversion wpe-platform-2.0 || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build DOH proxy
        working-directory: core/doh_proxy
        run: cargo build --release --features ech

      - name: Build Linux bundle
        env:
          PKG_CONFIG_PATH: ${{ env.WPE_PKGCONFIG }}:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          LD_LIBRARY_PATH: ${{ env.WPE_LIBDIR }}
          LIBRARY_PATH: ${{ env.WPE_LIBDIR }}
          CMAKE_PREFIX_PATH: ${{ env.WPE_ROOT }}/usr
        run: flutter build linux --release

      - name: Assemble AppDir
        run: |
          rm -rf "${APPDIR}" dist
          mkdir -p "${APPDIR}" dist

          cp -a build/linux/x64/release/bundle/. "${APPDIR}/"
          cp core/doh_proxy/target/release/doh_proxy_bin "${APPDIR}/doh_proxy_bin"
          cp web/icons/Icon-512.png "${APPDIR}/fluxdo.png"
          install -Dm644 linux/runner/fluxdo.desktop "${APPDIR}/fluxdo.desktop"
          ln -sf fluxdo.png "${APPDIR}/.DirIcon"

          mkdir -p "${APPDIR}/usr/lib/wpe-webkit-2.0/injected-bundle" "${APPDIR}/usr/share"
          cp -a "${WPE_LIBDIR}"/libWPEWebKit-2.0.so* "${APPDIR}/lib/"
          cp -a "${WPE_LIBDIR}"/libwpe-1.0.so* "${APPDIR}/lib/"
          cp -a "${WPE_LIBDIR}"/libWPEBackend-fdo-1.0.so* "${APPDIR}/lib/"
          cp -a "${WPE_LIBDIR}"/libWPEWebKit-2.0.so* "${APPDIR}/usr/lib/"
          cp -a "${WPE_LIBDIR}"/libwpe-1.0.so* "${APPDIR}/usr/lib/"
          cp -a "${WPE_LIBDIR}"/libWPEBackend-fdo-1.0.so* "${APPDIR}/usr/lib/"
          cp -a "${WPE_LIBDIR}/wpe-webkit-2.0"/WPE*Process "${APPDIR}/usr/lib/wpe-webkit-2.0/"
          cp -a "${WPE_LIBDIR}/wpe-webkit-2.0/injected-bundle"/libWPEInjectedBundle.so \
            "${APPDIR}/usr/lib/wpe-webkit-2.0/injected-bundle/"
          cp -a "${WPE_ROOT}/usr/share/wpe-webkit-2.0" "${APPDIR}/usr/share/"

          cat > "${APPDIR}/AppRun" <<'APPIMAGE_EOF'
          #!/bin/sh
          set -eu

          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="${HERE}/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="${HERE}/share:${HERE}/usr/share:${XDG_DATA_DIRS:-}"

          exec "${HERE}/fluxdo" "$@"
          APPIMAGE_EOF

          chmod +x "${APPDIR}/AppRun" "${APPDIR}/fluxdo" "${APPDIR}/doh_proxy_bin"

      - name: Download linuxdeploy
        run: |
          curl -L \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L \
            -o linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LDAI_NO_APPSTREAM: 1
          LDAI_OUTPUT: fluxdo-${{ github.ref_name }}-linux-x86_64.AppImage
          VERSION: ${{ github.ref_name }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/AppDir/lib:${{ github.workspace }}/AppDir/usr/lib:${{ env.WPE_LIBDIR }}
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir "${APPDIR}" \
            -e "${APPDIR}/fluxdo" \
            -e "${APPDIR}/doh_proxy_bin" \
            -d "${APPDIR}/fluxdo.desktop" \
            -i "${APPDIR}/fluxdo.png" \
            --output appimage

          mv ./*.AppImage dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
